# gitleaks configuration for airgap-devkit
# Suppressess known-false-positive curl-auth patterns in documentation files
# where placeholder text like REPLACE_WITH_ATLASSIAN_API_TOKEN is intentional.

title = "airgap-devkit gitleaks config"

# Keep the full built-in ruleset (PyPI tokens, private keys, cloud creds, etc.)
# active alongside the project allowlist below.
[extend]
useDefault = true

[allowlist]
  description = "Placeholder doc credentials and the synthetic constant used by Go unit tests"
  regexes = [
    '''REPLACE_WITH_''',
    # The fixed synthetic value assigned to the in-memory test server token.
    # Scoped to this exact string so a real secret in the same file is still caught.
    '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  ]
  paths = [
    '''README\.md''',
    '''\.ci/README\.md''',
    '''\.ci/jenkins/SETUP\.md''',
  ]
